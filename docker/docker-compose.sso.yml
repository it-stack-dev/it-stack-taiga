# =============================================================================
# IT-Stack: Taiga — Lab 04: SSO Integration
# Module 15 · Phase 4 · Lab 04
# =============================================================================
# Services: PostgreSQL · Redis · OpenLDAP · Keycloak · Mailhog · Taiga
# Ports:    Front:8430  Back:8031  Keycloak:8530  LDAP:3895  Mailhog:8730
# Credentials:
#   Taiga DB:   taiga / TaigaLab04!
#   Taiga UI:   admin / Admin04!
#   Keycloak:   admin / Admin04!
#   LDAP admin: cn=admin,dc=lab,dc=local / LdapLab04!
# What's new vs Lab 03:
#   + OpenLDAP directory for LDAP user federation
#   + Keycloak 24 dev-mode as OIDC IdP (it-stack realm)
#   + Taiga back configured with social-auth OIDC env vars
#   + Keycloak OIDC discovery endpoint tested in Lab 04
# =============================================================================

name: it-stack-taiga-lab04

services:

  # ── PostgreSQL ─────────────────────────────────────────────────────────────
  taiga-s04-db:
    image: postgres:15-alpine
    container_name: taiga-s04-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: taiga
      POSTGRES_USER: taiga
      POSTGRES_PASSWORD: TaigaLab04!
    volumes:
      - taiga-s04-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taiga"]
      interval: 10s
      timeout: 5s
      retries: 15
    networks:
      - taiga-s04-net
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"

  # ── Redis ──────────────────────────────────────────────────────────────────
  taiga-s04-redis:
    image: redis:7-alpine
    container_name: taiga-s04-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - taiga-s04-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - taiga-s04-net
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.1"

  # ── OpenLDAP ───────────────────────────────────────────────────────────────
  taiga-s04-ldap:
    image: osixia/openldap:1.5.0
    container_name: taiga-s04-ldap
    restart: unless-stopped
    environment:
      LDAP_ORGANISATION: "IT-Stack Lab"
      LDAP_DOMAIN: lab.local
      LDAP_ADMIN_PASSWORD: LdapLab04!
      LDAP_CONFIG_PASSWORD: ConfigLab04!
      LDAP_BASE_DN: dc=lab,dc=local
      LDAP_READONLY_USER: "true"
      LDAP_READONLY_USER_USERNAME: readonly
      LDAP_READONLY_USER_PASSWORD: ReadOnly04!
    ports:
      - "3895:389"
    volumes:
      - taiga-s04-ldap-data:/var/lib/ldap
      - taiga-s04-ldap-config:/etc/ldap/slapd.d
    healthcheck:
      test: ["CMD-SHELL", "ldapsearch -x -H ldap://localhost -b dc=lab,dc=local -D cn=admin,dc=lab,dc=local -w LdapLab04! cn=admin > /dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
    networks:
      - taiga-s04-net
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.25"

  # ── Keycloak ───────────────────────────────────────────────────────────────
  taiga-s04-kc:
    image: quay.io/keycloak/keycloak:24.0.3
    container_name: taiga-s04-kc
    restart: unless-stopped
    command: start-dev
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: Admin04!
      KC_HEALTH_ENABLED: "true"
      KC_DB: dev-file
      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME_STRICT_HTTPS: "false"
      KC_HTTP_ENABLED: "true"
    ports:
      - "8530:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/realms/master || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 30s
    networks:
      - taiga-s04-net
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1.0"

  # ── Mailhog ────────────────────────────────────────────────────────────────
  taiga-s04-mail:
    image: mailhog/mailhog:latest
    container_name: taiga-s04-mail
    restart: unless-stopped
    ports:
      - "8730:8025"
    networks:
      - taiga-s04-net
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.1"

  # ── Taiga Back ─────────────────────────────────────────────────────────────
  taiga-s04-back:
    image: taigaio/taiga-back:latest
    container_name: taiga-s04-back
    restart: unless-stopped
    depends_on:
      taiga-s04-db:
        condition: service_healthy
      taiga-s04-redis:
        condition: service_healthy
      taiga-s04-ldap:
        condition: service_healthy
    ports:
      - "8031:8000"
    environment:
      POSTGRES_DB: taiga
      POSTGRES_USER: taiga
      POSTGRES_PASSWORD: TaigaLab04!
      POSTGRES_HOST: taiga-s04-db
      TAIGA_SECRET_KEY: TaigaSecretKey04Lab!
      TAIGA_SITES_DOMAIN: localhost:8031
      TAIGA_SITES_SCHEME: http
      ENABLE_TELEMETRY: "false"
      EMAIL_BACKEND: django.core.mail.backends.smtp.EmailBackend
      DEFAULT_FROM_EMAIL: taiga@lab.local
      EMAIL_HOST: taiga-s04-mail
      EMAIL_PORT: "1025"
      EMAIL_USE_TLS: "False"
      # Keycloak OIDC (social-auth) reference
      KEYCLOAK_URL: http://taiga-s04-kc:8080
      KEYCLOAK_REALM: it-stack
      KEYCLOAK_CLIENT_ID: taiga
      KEYCLOAK_CLIENT_SECRET: TaigaKCSecret04!
      # LDAP configuration reference
      LDAP_SERVER: taiga-s04-ldap
      LDAP_PORT: "389"
      LDAP_BASE_DN: dc=lab,dc=local
      LDAP_BIND_DN: cn=admin,dc=lab,dc=local
      LDAP_BIND_PASSWORD: LdapLab04!
    volumes:
      - taiga-s04-back-data:/taiga-backend/media
    networks:
      - taiga-s04-net
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"

  # ── Taiga Front ────────────────────────────────────────────────────────────
  taiga-s04-front:
    image: taigaio/taiga-front:latest
    container_name: taiga-s04-front
    restart: unless-stopped
    depends_on:
      - taiga-s04-back
    ports:
      - "8430:80"
    environment:
      TAIGA_URL: http://taiga-s04-back:8000
      TAIGA_WEBSOCKETS_URL: ws://taiga-s04-back:8000
    networks:
      - taiga-s04-net
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.25"

# ── Networks ───────────────────────────────────────────────────────────────────
networks:
  taiga-s04-net:
    name: taiga-s04-net
    driver: bridge

# ── Volumes ────────────────────────────────────────────────────────────────────
volumes:
  taiga-s04-db-data:
  taiga-s04-redis-data:
  taiga-s04-ldap-data:
  taiga-s04-ldap-config:
  taiga-s04-back-data:

